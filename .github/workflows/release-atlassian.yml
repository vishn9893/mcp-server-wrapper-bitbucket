name: Release Atlassian MCP package

on:
  push:
    tags:
      - "confluence-v*"
      - "jira-v*"

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - tag_prefix: confluence-v
            package: confluence-mcp
          - tag_prefix: jira-v
            package: jira-mcp
    if: startsWith(github.ref_name, matrix.tag_prefix)
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package }}/dist/
