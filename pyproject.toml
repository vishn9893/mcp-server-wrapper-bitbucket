[project]
name = "bitbucket-mcp-server"
version = "2.0.0"
description = "Native Python MCP server for Bitbucket Server/Data Center"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0,<3.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
bitbucket-mcp = "bitbucket_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "respx>=0.21,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitbucket_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
