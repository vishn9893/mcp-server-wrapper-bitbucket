[project]
name = "bitbucket-mcp-atlassian"
version = "0.1.0"
description = "Native async Bitbucket Server/Data Center MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0,<1",
  "mcp>=1.2.0,<2",
  "pydantic-settings>=2.6.0,<3",
]

[project.scripts]
bitbucket-mcp = "bitbucket_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitbucket_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
